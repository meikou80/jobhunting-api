services:
  # PostgreSQLデータベース
  db:
    image: postgres:15
    container_name: jobhunting_db
    environment:
      POSTGRES_DB: jobhunting_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - jobhunting_network

  # Goアプリケーション (開発用)
  app:
    image: golang:1.23-alpine
    container_name: jobhunting_api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - GIN_MODE=debug
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=jobhunting_db
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_SSL_MODE=disable
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      - db
    networks:
      - jobhunting_network
    # 開発用（依存関係インストール後に実行）
    command: sh -c "go mod tidy && go run ./cmd"

volumes:
  postgres_data:

networks:
  jobhunting_network: